name: Unzip and Deploy Site

on:
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip the website files
        run: unzip SandBox-Tech-Bilingual-Website.zip

      - name: Build the static pages
        run: |
          cd SandBox-Tech-Bilingual-Website
          python3 build.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload generated dist directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'SandBox-Tech-Bilingual-Website/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

